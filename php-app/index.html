<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Contacto - PHP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f4f5;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #e4e4e7;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
        }

        h1 {
            color: #18181b;
            text-align: center;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #3f3f46;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4d4d8;
            border-radius: 6px;
            font-size: 14px;
            color: #18181b;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 1px #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #18181b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #3f3f46;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Registro de Contacto (PHP)</h1>
        <form action="registro.php" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <!-- El atributo pattern bloquea números y símbolos desde el navegador -->
                <input type="text" id="nombre" name="nombre" required 
                       placeholder="Ingrese su nombre" 
                       pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" 
                       title="Solo se permiten letras y espacios">
            </div>
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="nombre@empresa.com">
            </div>
            <button type="submit">Enviar Registro</button>
        </form>
    </div>
</body>
</html>
